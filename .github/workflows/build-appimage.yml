name: Build and Release Tabula AppImage

on:
  #schedule:
  #  - cron: '0 0 * * *' # Check upstream daily at 00:00 UTC
  workflow_dispatch:      # Manual trigger
    inputs:
      force_build:
        description: 'Force build even if tag already exists locally'
        required: false
        type: boolean
        default: false
      version_override:
        description: 'Target specific upstream release tag (e.g., v1.2.1)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      has_builds: ${{ steps.check.outputs.has_builds }}
      build_matrix: ${{ steps.check.outputs.build_matrix }}
    steps:
      - name: Check upstream releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force_build }}
          OVERRIDE_TAG: ${{ github.event.inputs.version_override }}
        run: |
          set -euo pipefail
          TARGETS='[]'

          if [ -n "$OVERRIDE_TAG" ]; then
            UPSTREAM_TAG="$OVERRIDE_TAG"
            echo "Using manual version override: $UPSTREAM_TAG"
          else
            UPSTREAM_TAG=$(gh api repos/tabulapdf/tabula/releases/latest --jq .tag_name 2>/dev/null || echo "")
          fi

          if [ -n "$UPSTREAM_TAG" ] && [ "$UPSTREAM_TAG" != "null" ]; then
            LOCAL_TAG_RELEASE=$(gh release view "$UPSTREAM_TAG" --json id -q .id 2>/dev/null || echo "")

            if [ "$FORCE" = "true" ] || [ -z "$LOCAL_TAG_RELEASE" ]; then
              echo "Scheduling build for upstream release: $UPSTREAM_TAG"
              TARGETS=$(jq -c --arg tag "$UPSTREAM_TAG" '. += [{
                "build_type": "tag",
                "ref": $tag,
                "release_tag": $tag,
                "version_name": $tag,
                "prerelease": false,
                "title": ("Tabula " + $tag)
              }]' <<< "$TARGETS")
            else
              echo "Release $UPSTREAM_TAG is already published locally."
            fi
          else
            echo "Failed to query upstream latest release."
          fi

          TARGET_COUNT=$(jq '. | length' <<< "$TARGETS")
          if [ "$TARGET_COUNT" -gt 0 ]; then
            echo "has_builds=true" >> "$GITHUB_OUTPUT"
            echo "build_matrix=$TARGETS" >> "$GITHUB_OUTPUT"
            echo "Scheduled builds: $TARGETS"
          else
            echo "has_builds=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream releases found. Skipping build."
          fi

  build-appimage:
    needs: check-upstream
    if: needs.check-upstream.outputs.has_builds == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.check-upstream.outputs.build_matrix) }}

    env:
      APPIMAGE_EXTRACT_AND_RUN: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget curl jq file icoutils zsync unzip \
            libcrypt1 libcrypt-dev libfreetype6 libasound2 \
            patchelf

      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          cd /tmp && ./appimagetool.AppImage --appimage-extract
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Create AppDir Skeleton
        run: |
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/lib \
                   AppDir/usr/lib/jvm \
                   AppDir/usr/share/tabula \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/metainfo \
                   AppDir/usr/share/icons/hicolor/256x256/apps

      - name: Download & Extract Eclipse Temurin OpenJDK 8 JRE
        run: |
          echo "Fetching latest Eclipse Temurin 8 JRE for Linux x64..."
          curl -f -sSL "https://api.adoptium.net/v3/binary/latest/8/ga/linux/x64/jre/hotspot/normal/eclipse" -o /tmp/temurin-jre8.tar.gz

          # Extract into isolated staging folder to determine layout safely
          mkdir -p /tmp/jre_staging
          tar -xzf /tmp/temurin-jre8.tar.gz -C /tmp/jre_staging

          # Find java executable dynamically
          FOUND_JAVA=$(find /tmp/jre_staging -type f -name "java" -perm -111 2>/dev/null | head -n 1)
          if [ -z "$FOUND_JAVA" ]; then
            echo "Error: java binary not found in JRE archive!" >&2
            exit 1
          fi

          # Resolve JRE root directory (parent of bin/)
          JRE_ROOT="$(dirname "$(dirname "$FOUND_JAVA")")"
          echo "Discovered JRE root directory at: $JRE_ROOT"

          # Copy JRE contents into AppDir/usr/lib/jvm
          cp -a "$JRE_ROOT"/* AppDir/usr/lib/jvm/
          chmod +x AppDir/usr/lib/jvm/bin/*

          # Strip unneeded assets
          rm -rf AppDir/usr/lib/jvm/man \
                 AppDir/usr/lib/jvm/legal \
                 AppDir/usr/lib/jvm/demo \
                 AppDir/usr/lib/jvm/sample

          # Build Assertion: Fail early if java binary is not in exact expected location
          if [ ! -x "AppDir/usr/lib/jvm/bin/java" ]; then
            echo "Build Assertion Failed: AppDir/usr/lib/jvm/bin/java is missing or non-executable!" >&2
            exit 1
          fi
          echo "JRE verified successfully: $(AppDir/usr/lib/jvm/bin/java -version 2>&1 | head -n 1)"

      - name: Download & Stage Tabula JAR (with Custom tabula-java Backend)
        run: |
          set -euo pipefail
          RAW_TAG="${{ matrix.target.ref }}"
          CLEAN_VERSION="${RAW_TAG#v}"

          echo "Downloading Tabula JAR package for version ${CLEAN_VERSION}..."
          curl -f -sSL "https://github.com/tabulapdf/tabula/releases/download/${RAW_TAG}/tabula-jar-${CLEAN_VERSION}.zip" -o /tmp/tabula-jar.zip
          unzip -q /tmp/tabula-jar.zip -d /tmp/tabula_extracted

          JAR_FILE=$(find /tmp/tabula_extracted -type f -name "*.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Error: tabula.jar not found in downloaded release zip." >&2
            exit 1
          fi

          cp "$JAR_FILE" AppDir/usr/share/tabula/tabula.jar

          # Build Assertion
          test -f "AppDir/usr/share/tabula/tabula.jar" || { echo "tabula.jar missing!"; exit 1; }


          # ====================================================================
          # Hot-swap the tabula-java backend inside tabula.jar
          # ====================================================================
          TABULA_JAR="AppDir/usr/share/tabula/tabula.jar"
          TARGET_TABULA_JAVA_VER="1.0.5" # Set your desired version

          echo "Inspecting current tabula-java in tabula.jar..."
          unzip -l "$TABULA_JAR" | grep -E "WEB-INF/lib/tabula-.*\.jar" || true

          # 1. Remove the old tabula-java jar from WEB-INF/lib/
          zip -d "$TABULA_JAR" "WEB-INF/lib/tabula-*.jar"

          # 2. Stage new tabula-java backend and required runtime dependencies
          PATCH_DIR=$(mktemp -d)
          mkdir -p "$PATCH_DIR/WEB-INF/lib"

          # Fetch tabula-java from Maven Central (or replace with your own artifact URL)
          curl -f -sSL "https://repo1.maven.org/maven2/technology/tabula/tabula/${TARGET_TABULA_JAVA_VER}/tabula-${TARGET_TABULA_JAVA_VER}.jar" \
            -o "$PATCH_DIR/WEB-INF/lib/tabula-${TARGET_TABULA_JAVA_VER}.jar"

          # tabula-java 1.0.4+ requires jts-core (which was not present in tabula 1.2.1)
          curl -f -sSL "https://repo1.maven.org/maven2/org/locationtech/jts/jts-core/1.20.0/jts-core-1.20.0.jar" \
            -o "$PATCH_DIR/WEB-INF/lib/jts-core-1.20.0.jar"

          # 3. Inject new JARs into tabula.jar
          (cd "$PATCH_DIR" && zip -u "$GITHUB_WORKSPACE/$TABULA_JAR" WEB-INF/lib/*)
          rm -rf "$PATCH_DIR"

          echo "Updated tabula.jar contents:"
          unzip -l "$TABULA_JAR" | grep -E "WEB-INF/lib/(tabula|jts-core)"

      - name: Resolve and Bundle Dynamic & Runtime Dependencies
        run: |
          set -euo pipefail
          echo "=== Resolving dependencies for AppDir ==="

          TARGET_LIB_DIR="AppDir/usr/lib"
          mkdir -p "$TARGET_LIB_DIR"

          # 1. Unpack internal JFFI/JNI native libs from tabula.jar for inspection
          mkdir -p /tmp/jar_natives
          unzip -q -o "AppDir/usr/share/tabula/tabula.jar" "*.so" -d /tmp/jar_natives 2>/dev/null || true

          # 2. Exclude pattern: Core glibc, graphics drivers, direct X11/wayland host client libs
          EXCLUDE_REGEX='^(libc\.so|ld-linux|libdl\.so|libm\.so|libpthread\.so|librt\.so|libresolv\.so|libutil\.so|libnss_|libGL\.so|libEGL\.so|libGLX\.so|libGLdispatch\.so|libdrm\.so|libgbm\.so|libvulkan\.so|libX11\.so|libxcb\.so|libXau\.so|libXdmcp\.so|libwayland-)'

          # 3. Explicitly bundle runtime dlopen() targets (like libcrypt for JRuby) first
          LIBCRYPT_SRC=$(ldconfig -p | grep 'libcrypt\.so\.1' | head -n 1 | awk '{print $NF}')
          if [ -n "$LIBCRYPT_SRC" ] && [ -f "$LIBCRYPT_SRC" ]; then
            echo "Bundling initial dlopen dependency: $LIBCRYPT_SRC"
            cp -L "$LIBCRYPT_SRC" "$TARGET_LIB_DIR/libcrypt.so.1"
            ln -sf "libcrypt.so.1" "$TARGET_LIB_DIR/libcrypt.so"
          else
            echo "Error: libcrypt.so.1 could not be located on the build host!" >&2
            exit 1
          fi

          # 4. Multi-pass iterative dependency resolution loop
          PROCESSED_ELFS=$(mktemp)
          ROUND=1

          while true; do
            echo "--- Dependency Resolution Pass $ROUND ---"
            
            # Find all ELF binaries across the JRE, JAR natives, and newly bundled libs in TARGET_LIB_DIR
            CURRENT_ELFS=$(mktemp)
            find AppDir/usr/lib/jvm /tmp/jar_natives "$TARGET_LIB_DIR" -type f -exec file {} + 2>/dev/null \
              | grep -E "ELF .* (executable|shared object)" \
              | cut -d: -f1 \
              | sort -u > "$CURRENT_ELFS"

            # Determine which ELFs have not been scanned yet
            sort -u -o "$PROCESSED_ELFS" "$PROCESSED_ELFS"
            UNPROCESSED_ELFS=$(comm -23 "$CURRENT_ELFS" "$PROCESSED_ELFS")
            rm -f "$CURRENT_ELFS"

            if [ -z "$UNPROCESSED_ELFS" ]; then
              echo "No new ELFs to scan. Dependency resolution converged."
              break
            fi

            # Collect resolved shared libraries from all un-scanned ELFs
            NEW_DEPS=$(mktemp)
            echo "$UNPROCESSED_ELFS" | while read -r elf; do
              [ -n "$elf" ] || continue
              echo "$elf" >> "$PROCESSED_ELFS"
              ldd "$elf" 2>/dev/null | awk '/=> \// {print $3}' >> "$NEW_DEPS" || true
            done

            SORTED_DEPS=$(mktemp)
            sort -u "$NEW_DEPS" > "$SORTED_DEPS"
            rm -f "$NEW_DEPS"

            COPIED_COUNT=0
            while read -r lib_path; do
              [ -n "$lib_path" ] || continue
              lib_name=$(basename "$lib_path")

              # Skip core glibc and excluded system graphics libraries
              if echo "$lib_name" | grep -E -q "$EXCLUDE_REGEX"; then
                continue
              fi

              # Copy newly found dependency into AppDir/usr/lib
              if [ ! -f "$TARGET_LIB_DIR/$lib_name" ]; then
                echo "Bundling detected dependency: $lib_name from $lib_path"
                cp -L "$lib_path" "$TARGET_LIB_DIR/$lib_name"
                chmod 755 "$TARGET_LIB_DIR/$lib_name"
                COPIED_COUNT=$((COPIED_COUNT + 1))
              fi
            done < "$SORTED_DEPS"
            rm -f "$SORTED_DEPS"

            echo "Pass $ROUND added $COPIED_COUNT new libraries."
            if [ "$COPIED_COUNT" -eq 0 ]; then
              echo "Transitive resolution complete."
              break
            fi

            ROUND=$((ROUND + 1))
          done
          rm -f "$PROCESSED_ELFS"

          # 5. Create SONAME symlinks so linkers can find canonical names
          echo "=== Generating SONAME symlinks ==="
          cd "$TARGET_LIB_DIR"
          for lib in *.so*; do
            [ -f "$lib" ] && [ ! -L "$lib" ] || continue
            soname=$(objdump -p "$lib" 2>/dev/null | awk '/SONAME/ {print $2}' || true)
            if [ -n "$soname" ] && [ ! -e "$soname" ]; then
              echo "Creating symlink: $soname -> $lib"
              ln -sf "$lib" "$soname"
            fi
          done
          cd - >/dev/null

          # 6. Apply patchelf to set RPATH to $ORIGIN
          # Single quotes around '$ORIGIN' are mandatory to prevent bash variable expansion!
          echo "=== Patching RPATH with patchelf ==="
          find "$TARGET_LIB_DIR" -type f -exec file {} + | grep -E "ELF .* shared object" | cut -d: -f1 | while read -r elf; do
            echo "Setting RPATH to \$ORIGIN on: $(basename "$elf")"
            patchelf --set-rpath '$ORIGIN' "$elf" || true
          done

          echo "Final bundled libraries in $TARGET_LIB_DIR:"
          ls -la "$TARGET_LIB_DIR"

      - name: Deploy Browser Bridge Wrapper for xdg-open
        run: |
          # Create a wrapper for xdg-open to sanitize LD_LIBRARY_PATH when Tabula triggers the host browser
          cat << 'EOF' > AppDir/usr/bin/xdg-open
          #!/usr/bin/env bash
          # Restore original host library path so the host browser does not inherit bundled AppImage libs
          if [ -n "${ORIG_LD_LIBRARY_PATH+x}" ]; then
            export LD_LIBRARY_PATH="${ORIG_LD_LIBRARY_PATH}"
          else
            unset LD_LIBRARY_PATH
          fi

          # Remove AppDir paths from PATH when invoking host xdg-open
          CLEAN_PATH=$(echo "$PATH" | tr ':' '\n' | grep -v "^${APPDIR:-/tmp/nonexistent}" | paste -sd:)
          PATH="$CLEAN_PATH"

          # Locate system xdg-open
          SYS_XDG_OPEN=$(which xdg-open 2>/dev/null || true)
          if [ -n "$SYS_XDG_OPEN" ] && [ "$SYS_XDG_OPEN" != "$0" ]; then
            exec "$SYS_XDG_OPEN" "$@"
          else
            # Fallback if xdg-open is not installed
            for browser in x-www-browser firefox google-chrome chromium chromium-browser; do
              if command -v "$browser" >/dev/null 2>&1; then
                exec "$browser" "$@"
              fi
            done
            echo "[Tabula] Warning: No host browser launcher found." >&2
            exit 1
          fi
          EOF
          chmod +x AppDir/usr/bin/xdg-open

      - name: Extract and Stage Application Icons
        run: |
          echo "Fetching official Tabula icon..."
          curl -sSL "https://raw.githubusercontent.com/tabulapdf/tabula/master/build/icons/tabula.ico" -o /tmp/tabula.ico

          mkdir -p /tmp/icons
          icotool -x /tmp/tabula.ico -o /tmp/icons/

          # Identify highest-resolution extracted PNG frame
          LARGEST_ICON=$(ls -S /tmp/icons/*.png | head -n 1)
          cp "$LARGEST_ICON" AppDir/tabula.png
          cp "$LARGEST_ICON" AppDir/.DirIcon
          cp "$LARGEST_ICON" AppDir/usr/share/icons/hicolor/256x256/apps/tabula.png

      - name: Deploy AppRun and Desktop Integration Metadata
        run: |
          # Use committed repository files or generate inline fallbacks
          if [ -f "AppRun" ]; then
            cp "AppRun" AppDir/AppRun
          else
            echo "Error: AppRun file is missing from repository." >&2
            exit 1
          fi
          chmod +x AppDir/AppRun

          if [ -f "tabula.desktop" ]; then
            cp "tabula.desktop" AppDir/tabula.desktop
            cp "tabula.desktop" AppDir/usr/share/applications/tabula.desktop
          else
            echo "Error: tabula.desktop file is missing from repository." >&2
            exit 1
          fi

          if [ -f "technology.tabula.appdata.xml" ]; then
            cp "technology.tabula.appdata.xml" AppDir/usr/share/metainfo/technology.tabula.appdata.xml
          fi

      - name: Package AppImage and Generate Hashes
        run: |
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          VERSION_NAME="${{ matrix.target.version_name }}"

          # Embedded RFC-compliant update string pointing to the latest generic release
          UPDATE_INFORMATION="gh-releases-zsync|${REPO_OWNER}|${REPO_NAME}|latest|Tabula-x86_64.AppImage.zsync"

          # 1. Build generic AppImage and generate matching generic zsync file
          appimagetool -n -u "$UPDATE_INFORMATION" AppDir "Tabula-x86_64.AppImage"

          # 2. Duplicate binary as version-specific asset
          cp "Tabula-x86_64.AppImage" "Tabula-${VERSION_NAME}-x86_64.AppImage"

          # 3. Generate SHA256 checksums
          sha256sum "Tabula-x86_64.AppImage" > "Tabula-x86_64.AppImage.sha256"
          sha256sum "Tabula-${VERSION_NAME}-x86_64.AppImage" > "Tabula-${VERSION_NAME}-x86_64.AppImage.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.target.release_tag }}
          name: ${{ matrix.target.title }}
          prerelease: ${{ matrix.target.prerelease }}
          make_latest: true
          body: |
            Automated AppImage bundle tracking upstream `tabulapdf/tabula`.

            - **Upstream Tag:** ${{ matrix.target.ref }}
            - **Bundled JRE:** Eclipse Temurin OpenJDK 8 JRE (Linux x64)
            - **Architecture:** Linux x86_64

            ### Direct Download Links
            - [Latest Generic AppImage](https://github.com/${{ github.repository }}/releases/download/${{ matrix.target.release_tag }}/Tabula-x86_64.AppImage)
            - [Version-Specific AppImage](https://github.com/${{ github.repository }}/releases/download/${{ matrix.target.release_tag }}/Tabula-${{ matrix.target.version_name }}-x86_64.AppImage)
            - [Zsync Delta File](https://github.com/${{ github.repository }}/releases/download/${{ matrix.target.release_tag }}/Tabula-x86_64.AppImage.zsync)
          files: |
            Tabula-x86_64.AppImage
            Tabula-x86_64.AppImage.zsync
            Tabula-x86_64.AppImage.sha256
            Tabula-${{ matrix.target.version_name }}-x86_64.AppImage
            Tabula-${{ matrix.target.version_name }}-x86_64.AppImage.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
